name: KH_Aw CI

on:
  push:
  pull_request:

jobs:
  validate-package:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python validator dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Parse every Python module
        run: python3 -m compileall -q plugins/kh-aw/scripts plugins/kh-aw/tests
      - name: Remove generated Python bytecode
        run: |
          find plugins/kh-aw -type f -name '*.pyc' -delete
          find plugins/kh-aw -type d -name __pycache__ -empty -delete
      - name: Parse every Node verification script
        run: |
          for file in plugins/kh-aw/scripts/*.mjs; do node --check "$file"; done
      - name: Validate JSON schemas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('plugins/kh-aw/schemas').glob('*.schema.json'))
          assert len(files) >= 6
          for path in files:
              payload=json.loads(path.read_text(encoding='utf-8'))
              assert payload['$schema']=='https://json-schema.org/draft/2020-12/schema'
          PY
      - name: Run KH_Aw enforcement tests
        run: python3 -m unittest discover -s plugins/kh-aw/tests -p 'test_*.py' -v
      - name: Smoke-test dynamic 2-60 subagent orchestration
        run: |
          python3 - <<'PY'
          import json, tempfile, sys
          from pathlib import Path
          sys.path.insert(0, 'plugins/kh-aw/scripts')
          from kh_aw.contracts import create_run_contracts
          from kh_aw.inventory import build_inventory
          from kh_aw.orchestration import ensure_agent_plan, record_subagent_result, record_lead_aggregation, orchestration_issues
          from kh_aw.run_lock import write_run_lock
          from kh_aw.util import write_json
          with tempfile.TemporaryDirectory() as td:
              root=Path(td); project=root/'project'; project.mkdir(); (project/'index.html').write_text('<html/>')
              run=root/'run'; run.mkdir(); instructions='one requirement\ntwo requirement\n'
              create_run_contracts(run,instructions,'web-responsive'); build_inventory(project,run/'inventory')
              inst=run/'contract/user-instructions.txt'; inst.write_text(instructions)
              state={'schemaVersion':'3.0','engineVersion':'3.2.0','runId':'ci','projectRoot':str(project),'workspaceRoot':str(root/'workspace'),'runRoot':str(run),'analysisMode':'analysis-folder-not-provided','analysisFolder':'','analysisSourceRoot':str(project),'instructionsFile':str(inst),'targetPipeline':'web-responsive','stageStatus':{},'repair':{}}
              write_run_lock(run,state); write_json(run/'state.json',state)
              plan=ensure_agent_plan(run,state,'intake',force=True); assert plan['selectedSubAgents']==2
              ids=[]
              for i,a in enumerate(plan['assignments']):
                  sid=f'CI-SUB-SESSION-{i:02d}'
                  review=a['reviewTargetWorkerIds']
                  invocation=f"/agents CI {a['taskId']}"
                  out=run/'orchestration'/'intake'/'outputs'/f'{i}.md'; out.parent.mkdir(parents=True,exist_ok=True)
                  receipt=run/'orchestration'/'intake'/'receipts'/f'{i}.json'; receipt.parent.mkdir(parents=True,exist_ok=True)
                  out.write_text('\n'.join([a['workerId'],a['taskId'],sid,a['dispatchContractSha256'],a['scopeIds'][0],*review,'physical independent result '*10]))
                  write_json(receipt,{'schemaVersion':'3.2','stage':'intake','workerId':a['workerId'],'taskId':a['taskId'],'sessionId':sid,'delegationMode':'native-agents','invocation':invocation,'dispatchContractSha256':a['dispatchContractSha256'],'issuedAt':f'2026-07-24T00:00:{i:02d}Z'})
                  record_subagent_result(run,stage='intake',worker_id=a['workerId'],task_id=a['taskId'],session_id=sid,invocation=invocation,invocation_receipt_file=receipt,evidence_file=out,review_of_worker_ids=review)
                  ids.append(a['workerId'])
              from kh_aw.util import sha256_file
              lead_contract_sha=sha256_file(run/'orchestration'/'intake'/'lead-contract.json')
              lead=run/'orchestration'/'intake'/'lead.md'
              lead.write_text('\n'.join(['leadAgentId: CI-LEAD','leadSessionId: CI-LEAD-SESSION',plan['planFingerprint'],lead_contract_sha,*ids,'merged all worker results and resolved coverage conflicts '*8]))
              record_lead_aggregation(run,stage='intake',lead_agent_id='CI-LEAD',lead_session_id='CI-LEAD-SESSION',evidence_file=lead,accepted_worker_ids=ids)
              assert orchestration_issues(run,state,'intake') == []
          PY
      - name: Reject accidental APK-install execution logic
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'plugins/kh-aw/scripts')
          from kh_aw.tooling import command_forbidden
          for command in ['adb install app.apk','./gradlew installDebug','./gradlew connectedDebugAndroidTest','bundletool install-apks --apks app.apks']:
              assert command_forbidden(command), command
          for command in ['./gradlew assembleDebug','./gradlew testDebugUnitTest','./gradlew lintDebug','flutter build apk --debug']:
              assert command_forbidden(command) is None, command
          PY
      - name: Rebuild package SHA-256 manifest
        run: python3 plugins/kh-aw/scripts/kh_aw_cli.py build-package-manifest --plugin-root plugins/kh-aw
      - name: Validate plugin, marketplace, and package integrity
        run: python3 plugins/kh-aw/scripts/kh_aw_cli.py doctor --plugin-root plugins/kh-aw --marketplace-root .

  dependency-bootstrap-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser QA dependencies
        working-directory: plugins/kh-aw
        run: npm install --ignore-scripts
      - name: Verify browser QA modules load
        working-directory: plugins/kh-aw
        run: node -e "Promise.all([import('playwright'),import('@axe-core/playwright'),import('lighthouse'),import('pixelmatch'),import('pngjs')]).then(()=>console.log('KH_Aw browser modules OK'))"
